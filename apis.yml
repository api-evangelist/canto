- aid: canto:canto-webhooks-api
  name: Canto webhooks API
  description: >-
    Webhooks are used to notify your application when certain events occur within the system.

    They can be configured to send a POST request to a specified URL when a specific event happens.

    Available resources and the events they support:

    - product
      - created
      - updated
      - deleted
    - variant
      - created
      - updated
      - deleted
    - import
      - started
      - completed
      - failed

    You can validate the payload using the +X-Webhook-Signature+ header. It's a SHA256 hash of the payload,
    signed with the secret key.
  humanURL: https://www.canto.com/api/
  baseURL: https://api.canto.com/
  tags:
  - Webhook
  tags_raw:
  - webhooks
  properties:
  - type: OpenAPI
    url: openapi/canto-webhooks-api-openapi.yml
  - type: Documentation
    url: https://www.canto.com/api/
