openapi: 3.2.0
info:
  title: Canto PIM Bulk Products Channel Templates API
  description: Canto APIs enable seamless synchronization between the PIM + DAM and external systems that rely on accurate, up-to-date product content.
  version: v1.0.1
servers:
- url: https://{tenantSubdomain}.{region}/api/v1/pim/
  variables:
    tenantSubdomain:
      default: demo
    region:
      enum:
      - canto.com
      - canto.global
      - canto.de
      - au.canto.com
      - ca.canto.com
      default: canto.com
security:
- bearerAuth: []
tags:
- name: bulk_products_channel_templates
  description: 'Perform bulk products operation on a Product Channel Template


    These endpoints allow you to add or remove products that are associated with a specific channel template in bulk.'
paths:
  /bulk/products/channel_templates:
    post:
      tags:
      - bulk_products_channel_templates
      summary: Perform bulk products operation on a Product Channel Template
      operationId: post_api_v1_bulk_products_channel_templates
      requestBody:
        content:
          application/json:
            schema:
              required:
              - operation
              - product_channel_template_id
              - product_ids
              type: object
              properties:
                operation:
                  type: string
                  description: The operation to perform
                  enum:
                  - add
                  - remove
                  example: add
                product_channel_template_id:
                  type: integer
                  description: Product Channel Template ID
                  example: 1
                product_ids:
                  type: array
                  description: Array of Product IDs to add to or remove from the template
                  items:
                    type: integer
                  example:
                  - 1
                  - 2
                  - 3
                  - 4
                  - 5
            example:
              operation: add
              product_channel_template_id: 1
              product_ids:
              - 1
              - 2
              - 3
              - 4
              - 5
        required: true
      responses:
        '200':
          description: Bulk products operation on Product Channel Template successful
          content:
            '*/*':
              schema:
                required:
                - products
                type: object
                properties:
                  products:
                    type: array
                    description: Array of Products
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: Product ID
                        product_category_id:
                          type: integer
                          description: Product category ID
                        product_type_id:
                          type: integer
                          description: Product type ID
                        has_variants:
                          type: boolean
                          description: Whether the product has variants
                        dimension1_id:
                          type:
                          - integer
                          - 'null'
                          description: First dimension ID
                        dimension2_id:
                          type:
                          - integer
                          - 'null'
                          description: Second dimension ID
                        dimension3_id:
                          type:
                          - integer
                          - 'null'
                          description: Third dimension ID
                        created_at:
                          type: string
                          format: date-time
                          description: Creation timestamp
                        updated_at:
                          type: string
                          format: date-time
                          description: Last update timestamp
                        user_id:
                          type: string
                          description: User ID associated with the product
                        product_custom_attributes:
                          type: array
                          description: Array of custom attributes for the product
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                                description: Attribute name
                              value:
                                type: string
                                description: Attribute value
                              data_type:
                                type: string
                                description: Data type of the attribute
                              product_custom_attribute_id:
                                type: integer
                                description: Custom attribute ID
                              product_attribute_group_id:
                                type:
                                - integer
                                - 'null'
                                description: Attribute group ID
                        variants:
                          type: array
                          description: Array of product variants
                          items:
                            type: object
                            properties:
                              id:
                                type: integer
                                description: Variant ID
                              dimension_options:
                                type: object
                                description: Dimension options for the variant
                                properties:
                                  primary:
                                    type:
                                    - object
                                    - 'null'
                                    properties:
                                      name:
                                        type: string
                                        description: Dimension name
                                      value:
                                        type: string
                                        description: Dimension value
                                      dimension_id:
                                        type: integer
                                        description: Dimension ID
                                      dimension_option_id:
                                        type: integer
                                        description: Dimension option ID
                                  secondary:
                                    type:
                                    - object
                                    - 'null'
                                    properties:
                                      name:
                                        type: string
                                        description: Dimension name
                                      value:
                                        type: string
                                        description: Dimension value
                                      dimension_id:
                                        type: integer
                                        description: Dimension ID
                                      dimension_option_id:
                                        type: integer
                                        description: Dimension option ID
                                  tertiary:
                                    type:
                                    - object
                                    - 'null'
                                    properties:
                                      name:
                                        type: string
                                        description: Dimension name
                                      value:
                                        type: string
                                        description: Dimension value
                                      dimension_id:
                                        type: integer
                                        description: Dimension ID
                                      dimension_option_id:
                                        type: integer
                                        description: Dimension option ID
                              product_custom_attributes:
                                type: array
                                description: Array of custom attributes for the variant
                                items:
                                  type: object
                                  properties:
                                    name:
                                      type: string
                                      description: Attribute name
                                    value:
                                      type: string
                                      description: Attribute value
                                    data_type:
                                      type: string
                                      description: Data type of the attribute
                                    product_custom_attribute_id:
                                      type: integer
                                      description: Custom attribute ID
                                    product_attribute_group_id:
                                      type:
                                      - integer
                                      - 'null'
                                      description: Attribute group ID
                            additionalProperties: false
                          additionalProperties: false
                additionalProperties: false
        '400':
          description: The request parameters were invalid
          content: {}
        '401':
          description: User is not permitted to use the API or Authentication is invalid
          content: {}
        '404':
          description: Product Channel Template ID not found
          content: {}
        '422':
          description: There was an error with your bulk products operation on the channel template
          content: {}
        '500':
          description: Something went wrong
          content: {}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: AccessToken
x-original-swagger-version: '2.0'
