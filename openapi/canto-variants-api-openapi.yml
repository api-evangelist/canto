                  description: Tertiary Dimension Option ID
                product_custom_attributes:
                  type: array
                  description: Array of product attributes' data
                  items:
                    type: string
        required: true
      responses:
        '200':
          description: Successfully created Product Variant
          content:
            '*/*':
              schema:
                required:
                - dimension_options
                - id
                - product_assets
                - product_custom_attributes
                type: object
                properties:
                  id:
                    type: integer
                    description: Variant ID
                  dimension_options:
                    type: object
                    properties:
                      primary:
                        type: object
