openapi: 3.2.0
info:
  title: Canto PIM Product Custom Attributes API
  description: Canto APIs enable seamless synchronization between the PIM + DAM and external systems that rely on accurate, up-to-date product content.
  version: v1.0.1
servers:
- url: https://{tenantSubdomain}.{region}/api/v1/pim/
  variables:
    tenantSubdomain:
      default: demo
    region:
      enum:
      - canto.com
      - canto.global
      - canto.de
      - au.canto.com
      - ca.canto.com
      default: canto.com
security:
- bearerAuth: []
tags:
- name: product_custom_attributes
paths:
  /product_custom_attributes:
    get:
      tags:
      - product_custom_attributes
      summary: Get Product Custom Attributes
      description: Retrieve all custom attributes defined in the Product Hub
      operationId: get_api_v1_product_custom_attributes
      parameters:
      - name: data_type
        in: query
        description: If set, only product custom attributes with the passed value for `data_type` will be returned
        schema:
          type: string
          enum:
          - text
          - number
          - date
          - image
      responses:
        '200':
          description: Successfully fetched Custom attributes
          headers:
            page-items:
              description: Number of items per page
              schema:
                type: integer
            link:
              description: Standard link header defined in RFC 8228. Contains links for first, last, next, and prev pages with respective `rel` attributes
              schema:
                type: string
            current-page:
              description: Current page number
              schema:
                type: integer
            total-count:
              description: Total number of items
              schema:
                type: integer
            total-pages:
              description: Total number of pages
              schema:
                type: integer
          content:
            '*/*':
              schema:
                required:
                - product_custom_attributes
                type: object
                properties:
                  product_custom_attributes:
                    type: array
                    description: Array of Product Custom Attributes
                    items:
                      type: string
                additionalProperties: false
        '400':
          description: The request was invalid
          content: {}
        '401':
          description: User is not permitted to use the API or Authentication is invalid
          content: {}
        '500':
          description: Something went wrong
          content: {}
    post:
      tags:
      - product_custom_attributes
      summary: Create Product Custom Attribute
      description: Create a new custom attribute
      operationId: post_api_v1_product_custom_attributes
      requestBody:
        content:
          application/json:
            schema:
              required:
              - name
              type: object
              properties:
                name:
                  type: string
                  description: Product Custom Attribute Name
          multipart/form-data:
            schema:
              required:
              - name
              type: object
              properties:
                name:
                  type: string
                  description: Product Custom Attribute Name
        required: true
      responses:
        '200':
          description: Successfully created Product Custom Attribute
          content:
            '*/*':
              schema:
                required:
                - data_type
                - id
                - name
                - position
                - product_attribute_group_id
                type: object
                properties:
                  id:
                    type: number
                    description: Product Custom Attribute ID
                  name:
                    type: string
                    description: Product Custom Attribute Name
                  data_type:
                    type: string
                    description: Product Custom Attribute Data type
                    enum:
                    - text
                    - number
                    - date
                    - image
                  product_attribute_group_id:
                    type: number
                    description: Product Custom Attribute Group ID
                  position:
                    type: number
                    description: Product Custom Attribute position within its group
                additionalProperties: false
        '400':
          description: The request was invalid
          content: {}
        '401':
          description: User is not permitted to use the API or Authentication is invalid
          content: {}
        '422':
          description: There was an error creating your Type
          content: {}
        '500':
          description: Something went wrong
          content: {}
  /product_custom_attributes/{id}:
    get:
      tags:
      - product_custom_attributes
      summary: Get Product Custom Attribute
      description: Get a specific custom attribute by ID.
      operationId: get_api_v1_product_custom_attributes_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: number
      responses:
        '200':
          description: Successfully fetched Product Custom Attribute
          content:
            '*/*':
              schema:
                required:
                - data_type
                - id
                - position
                - product_attribute_group_id
                type: object
                properties:
                  id:
                    type: number
                    description: Product Custom Attribute ID
                  name:
                    type: string
                    description: Product Custom Attribute Name
                  data_type:
                    type: string
                    description: Product Custom Attribute Data type
                    enum:
                    - text
                    - number
                    - date
                    - image
                  product_attribute_group_id:
                    type: number
                    description: Product Custom Attribute Group ID
                  position:
                    type: number
                    description: Product Custom Attribute position within its group
                additionalProperties: false
        '400':
          description: The request was invalid
          content: {}
        '401':
          description: User is not permitted to use the API or Authentication is invalid
          content: {}
        '404':
          description: Product Custom Attribute ID not found
          content: {}
        '500':
          description: Something went wrong
          content: {}
    put:
      tags:
      - product_custom_attributes
      summary: Update Product Custom Attribute
      description: Update a custom attribute
      operationId: put_api_v1_product_custom_attributes_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: number
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Product Custom Attribute Name
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Product Custom Attribute Name
      responses:
        '200':
          description: Successfully updated Product Custom Attribute
          content:
            '*/*':
              schema:
                required:
                - data_type
                - id
                - position
                - product_attribute_group_id
                type: object
                properties:
                  id:
                    type: number
                    description: Product Custom Attribute ID
                  name:
                    type: string
                    description: Product Custom Attribute Name
                  data_type:
                    type: string
                    description: Product Custom Attribute Data type
                    enum:
                    - text
                    - number
                    - date
                    - image
                  product_attribute_group_id:
                    type: number
                    description: Product Custom Attribute Group ID
                  position:
                    type: number
                    description: Product Custom Attribute position within its group
                additionalProperties: false
        '400':
          description: The request was invalid
          content: {}
        '401':
          description: User is not permitted to use the API or Authentication is invalid
          content: {}
        '404':
          description: Product Custom Attribute ID not found
          content: {}
        '422':
          description: There was an error updating your Product Custom Attribute
          content: {}
        '500':
          description: Something went wrong
          content: {}
    patch:
      tags:
      - product_custom_attributes
      summary: Update Product Custom Attribute
      description: Update a custom attribute
      operationId: patch_api_v1_product_custom_attributes_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: number
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Product Custom Attribute Name
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Product Custom Attribute Name
      responses:
        '200':
          description: Successfully updated Product Custom Attribute
          content:
            '*/*':
              schema:
                required:
                - data_type
                - id
                - position
                - product_attribute_group_id
                type: object
                properties:
                  id:
                    type: number
                    description: Product Custom Attribute ID
                  name:
                    type: string
                    description: Product Custom Attribute Name
                  data_type:
                    type: string
                    description: Product Custom Attribute Data type
                    enum:
                    - text
                    - number
                    - date
                    - image
                  product_attribute_group_id:
                    type: number
                    description: Product Custom Attribute Group ID
                  position:
                    type: number
                    description: Product Custom Attribute position within its group
                additionalProperties: false
        '400':
          description: The request was invalid
          content: {}
        '401':
          description: User is not permitted to use the API or Authentication is invalid
          content: {}
        '404':
          description: Product Custom Attribute ID not found
          content: {}
        '422':
          description: There was an error updating your Product Custom Attribute
          content: {}
        '500':
          description: Something went wrong
          content: {}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: AccessToken
x-original-swagger-version: '2.0'
