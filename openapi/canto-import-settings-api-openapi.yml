openapi: 3.2.0
info:
  title: Canto PIM Import Settings API
  description: Canto APIs enable seamless synchronization between the PIM + DAM and external systems that rely on accurate, up-to-date product content.
  version: v1.0.1
servers:
- url: https://{tenantSubdomain}.{region}/api/v1/pim/
  variables:
    tenantSubdomain:
      default: demo
    region:
      enum:
      - canto.com
      - canto.global
      - canto.de
      - au.canto.com
      - ca.canto.com
      default: canto.com
security:
- bearerAuth: []
tags:
- name: import_settings
  description: 'API endpoints for configuring how CSV imports should be processed.

    This includes:

    - Mapping CSV headers to product attributes

    - Configuring how product variations should be handled

    - Setting up category and type assignments'
paths:
  /import_settings:
    post:
      tags:
      - import_settings
      summary: Configure import mappings and variation formats
      description: 'Creates or retrieves channel template and format settings based on provided mappings.


        This endpoint helps configure how CSV data will be imported by:

        1. Mapping CSV headers to product attributes

        2. Defining how variations should be grouped

        3. Specifying dimension and option columns


        Returns IDs needed for the actual import process.'
      operationId: post_api_v1_import_settings
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                custom_attribute_mappings[header_name]:
                  type: number
                  description: Key is CSV header, value is product custom attribute ID
                variation_formatting[group_by][columns]:
                  type: array
                  description: Column headers to group by
                  items:
                    type: string
                variation_formatting[group_by][parent_key]:
                  type: string
                  description: Column header for parent SKU
                variation_formatting[group_by][child_key]:
                  type: string
                  description: Column header for child SKU reference
                variation_formatting[dimensions][primary][dimension]:
                  type: string
                  description: Dimension column header
                variation_formatting[dimensions][primary][dimension_option]:
                  type: string
                  description: Dimension option column header
                variation_formatting[dimensions][secondary][dimension]:
                  type: string
                  description: Dimension column header
                variation_formatting[dimensions][secondary][dimension_option]:
                  type: string
                  description: Dimension option column header
                variation_formatting[dimensions][tertiary][dimension]:
                  type: string
                  description: Dimension column header
                variation_formatting[dimensions][tertiary][dimension_option]:
                  type: string
                  description: Dimension option column header
          multipart/form-data:
            schema:
              type: object
              properties:
                custom_attribute_mappings[header_name]:
                  type: number
                  description: Key is CSV header, value is product custom attribute ID
                variation_formatting[group_by][columns]:
                  type: array
                  description: Column headers to group by
                  items:
                    type: string
                variation_formatting[group_by][parent_key]:
                  type: string
                  description: Column header for parent SKU
                variation_formatting[group_by][child_key]:
                  type: string
                  description: Column header for child SKU reference
                variation_formatting[dimensions][primary][dimension]:
                  type: string
                  description: Dimension column header
                variation_formatting[dimensions][primary][dimension_option]:
                  type: string
                  description: Dimension option column header
                variation_formatting[dimensions][secondary][dimension]:
                  type: string
                  description: Dimension column header
                variation_formatting[dimensions][secondary][dimension_option]:
                  type: string
                  description: Dimension option column header
                variation_formatting[dimensions][tertiary][dimension]:
                  type: string
                  description: Dimension column header
                variation_formatting[dimensions][tertiary][dimension_option]:
                  type: string
                  description: Dimension option column header
      responses:
        '200':
          description: Template and format IDs for use in import
          content:
            '*/*':
              schema:
                required:
                - channel_format_id
                - channel_template_id
                type: object
                properties:
                  channel_template_id:
                    type: number
                    description: ID of the configured channel template
                  channel_format_id:
                    type: number
                    description: ID of the configured format
                additionalProperties: false
        '404':
          description: Template or format not found
          content: {}
        '422':
          description: Invalid mapping configuration
          content: {}
        '500':
          description: Internal server error
          content: {}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: AccessToken
x-original-swagger-version: '2.0'
