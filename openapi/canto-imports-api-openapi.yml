openapi: 3.2.0
info:
  title: Canto PIM Imports API
  description: Canto APIs enable seamless synchronization between the PIM + DAM and external systems that rely on accurate, up-to-date product content.
  version: v1.0.1
servers:
- url: https://{tenantSubdomain}.{region}/api/v1/pim/
  variables:
    tenantSubdomain:
      default: demo
    region:
      enum:
      - canto.com
      - canto.global
      - canto.de
      - au.canto.com
      - ca.canto.com
      default: canto.com
security:
- bearerAuth: []
tags:
- name: Imports
  description: 'API endpoint for importing products from a CSV file.

    Supports multipart form data uploads with import configuration.'
paths:
  /imports:
    post:
      tags:
      - Imports
      summary: Import products from CSV
      description: 'Creates a new product import job from a CSV file.


        The CSV file should be uploaded as multipart form data along with

        the channel template and channel format IDs for processing the import.'
      operationId: post_api_v1_imports
      requestBody:
        content:
          application/json:
            schema:
              required:
              - channel_format_id
              - channel_template_id
              - file
              type: object
              properties:
                file:
                  type: string
                  description: The CSV file to import (multipart form data)
                channel_template_id:
                  type: string
                  description: Channel template ID that contains the custom attribute mappings
                channel_format_id:
                  type: string
                  description: Channel format ID that contains the variation format settings
                product_type_id:
                  type: string
                  description: Product type ID to assign to imported products
                product_category_id:
                  type: string
                  description: Product category ID to assign to imported products
                product_category_header:
                  type: string
                  description: Product category header in CSV to use to dynamically assign the product category (max 255 chars)
                product_category_id_header:
                  type: string
                  description: Product category ID header in CSV to use to dynamically assign the product category (max 255 chars)
          multipart/form-data:
            schema:
              required:
              - channel_format_id
              - channel_template_id
              - file
              type: object
              properties:
                file:
                  type: string
                  description: The CSV file to import (multipart form data)
                channel_template_id:
                  type: string
                  description: Channel template ID that contains the custom attribute mappings
                channel_format_id:
                  type: string
                  description: Channel format ID that contains the variation format settings
                product_type_id:
                  type: string
                  description: Product type ID to assign to imported products
                product_category_id:
                  type: string
                  description: Product category ID to assign to imported products
                product_category_header:
                  type: string
                  description: Product category header in CSV to use to dynamically assign the product category (max 255 chars)
                product_category_id_header:
                  type: string
                  description: Product category ID header in CSV to use to dynamically assign the product category (max 255 chars)
        required: true
      responses:
        '400':
          description: Missing required parameters or invalid file format
          content: {}
        '404':
          description: Template or format not found
          content: {}
        '422':
          description: Invalid import configuration
          content: {}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: AccessToken
x-original-swagger-version: '2.0'
